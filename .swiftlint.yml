# SwiftLint Configuration for Navigator
# Code quality and consistency standards

# Directories and files to lint
included:
  - Sources/
  - Tests/
  - Examples/

# Directories and files to exclude from linting
excluded:
  - .build/
  - .swiftpm/
  - Package.swift
  - .claude/
  - "**/swift-syntax/**"
  - "**/checkouts/**"

# Configure specific rules
disabled_rules:
  - todo
  - discouraged_none_name
  - orphaned_doc_comment
  - multiline_arguments
  - multiline_parameters
  - let_var_whitespace
  - force_unwrapping

# Enable opt-in rules for code quality
opt_in_rules:
  - comment_spacing
  - empty_count
  - explicit_init
  - implicit_return
  - modifier_order
  - sorted_imports
  - strict_fileprivate
  - unavailable_function
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_assert
  - empty_xctest_method
  - first_where
  - flatmap_over_map_reduce
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - multiline_function_chains
  - multiline_literal_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - single_test_class
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Rule configurations
comment_spacing:
  severity: warning

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1100
  error: 2000

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 700
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 4
    error: 8

# Identifier naming rules
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 45
    error: 80
  excluded:
    - id
    - ID
    - url
    - URL
    - uri
    - URI
    - ui
    - api

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 45
    error: 80

# Function parameter naming
function_parameter_count:
  warning: 5
  error: 8

# Large tuple warning
large_tuple:
  warning: 3
  error: 4

# Multiple closures with trailing closure
multiple_closures_with_trailing_closure:
  severity: warning

# Reporter configuration
reporter: "xcode"

# Analysis configuration
analyzer_rules:
  - explicit_self
  - unused_import
  - unused_declaration
